<main id="main">
  <section class="page-head">
    <div class="wrap">
      <div class="crumbs reveal"><a href="/">Home</a><span class="s">/</span><span>Work</span><span class="s">/</span><span>{{work_crumb}}</span></div>
      <h1 class="h-page reveal" style="--d:.05s">{{work_heading}}</h1>
      <p class="lede reveal" style="--d:.1s">{{work_lede}}</p>
      <nav class="subnav reveal" style="--d:.15s" aria-label="Work sections">{{work_subnav}}</nav>
    </div>
  </section>
  <section class="section" style="padding-top:0">
    <div class="wrap">
      <h2 class="visually-hidden">{{work_crumb}}</h2>
      {{work_note}}
      <div class="cards">
        {{work_cards}}
      </div>
    </div>
  </section>
</main>
